services:
  # ─── BACKEND WEB SERVICE (Horizontally Scalable & Stateless) ───
  - type: web
    name: dailyearn-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /health/liveness
    plan: standard
    numInstances: 4
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dailyearn-db
          property: connectionString
      - key: REDIS_URL
        value: redis://localhost:6379
      - key: MAX_DB_CONNECTIONS
        value: "100"
      - key: RESERVED_CONNECTIONS
        value: "20"
      - key: BACKEND_INSTANCES
        value: "4"
      - key: STATEMENT_TIMEOUT_MS
        value: "5000"
      - key: GROQ_TIMEOUT_MS
        value: "8000"
      - key: CIRCUIT_BREAKER_FAIL_THRESHOLD
        value: "5"
      - key: CIRCUIT_BREAKER_RESET_TIMEOUT_MS
        value: "30000"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: CORS_ORIGIN
        value: https://dailyearn-frontend.onrender.com
      - key: ADMIN_SECRET
        generateValue: true

  # ─── FRONTEND STATIC SITE (Edge & CDN Accelerated) ───
  - type: static
    name: dailyearn-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    envVars:
      - key: VITE_API_URL
        value: https://dailyearn-backend.onrender.com

databases:
  # ─── MANAGED POSTGRESQL (Connection Budgeted) ───
  - name: dailyearn-db
    databaseName: dailyearn
    user: dailyearn
    plan: standard
