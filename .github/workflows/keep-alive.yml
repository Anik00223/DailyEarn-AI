name: Keep Alive Render Server

on:
  schedule:
    # Runs every 10 minutes 24/7 (keeps Render free tier from sleeping)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping DailyEarn AI Backend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://dailyearn-ai-1.onrender.com/api/health)
          echo "DailyEarn Backend Ping Status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Warning: Received HTTP $STATUS"
          else
            echo "Backend is live and healthy!"
          fi
